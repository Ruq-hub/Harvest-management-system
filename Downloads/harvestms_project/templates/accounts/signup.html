{% extends "base.html" %}
{% block title %}Sign up — Harvest MS{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4 mt-4">
      <h3 class="mb-3 text-center">Create an Account</h3>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-brand w-100 mt-2" type="submit">Sign up</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
