{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card p-4">
      <h3 class="mb-3">{{ title }}</h3>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-brand" type="submit">Save Harvest Record</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
