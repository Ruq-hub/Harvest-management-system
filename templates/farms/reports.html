{% extends "base.html" %}
{% block content %}
<h2>Reports — Harvest Summary by Crop</h2>
<div class="card p-3">
<table class="table">
  <thead><tr><th>Crop</th><th>Total Harvests</th><th>Total Quantity (kg)</th></tr></thead>
  <tbody>
  {% for row in by_crop %}
    <tr><td>{{ row.crop__name }}</td><td>{{ row.harvests }}</td><td>{{ row.total_kg }}</td></tr>
  {% empty %}
    <tr><td colspan="3" class="text-muted">No data yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
